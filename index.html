<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TBA360 戰鬥力探測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
    --hud: #3dff8b;
    --hud-dim: rgba(61,255,139,.45);
    --hud-faint: rgba(61,255,139,.14);
    --energy: #ff9d00;
    --danger: #ff3b3b;
    --bg: #030705;
    --panel: rgba(5,16,10,.9);
    --text: #e6fff0;
    --muted: #7fa38c;
    --aura: #9fe8ff;
    --mono: 'Share Tech Mono', ui-monospace, Menlo, monospace;
    --digit: 'Orbitron', 'Share Tech Mono', ui-monospace, monospace;
}

/* ---------- 基礎 ---------- */
body {
    background-color: var(--bg);
    background-image:
        radial-gradient(ellipse at 50% 0%, rgba(61,255,139,.10), transparent 60%),
        linear-gradient(var(--hud-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--hud-faint) 1px, transparent 1px);
    background-size: 100% 100%, 36px 36px, 36px 36px;
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
    margin: 0; padding-bottom: 50px;
    display: flex; flex-direction: column; align-items: center;
}
/* 全畫面掃描線 */
body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}

/* ---------- Banner ---------- */
.banner {
    width: 100%; height: 300px;
    background-color: #000;
    background-image: url('https://i.meee.com.tw/0neg3F9.png');
    background-size: contain; background-repeat: no-repeat; background-position: center;
    border-bottom: 2px solid var(--hud); box-shadow: 0 2px 24px rgba(61,255,139,.35);
    margin-bottom: 20px; position: relative;
}
.banner-text {
    position: absolute; bottom: 12px; right: 12px;
    font-family: var(--mono); font-size: 1.3rem; letter-spacing: 3px; color: var(--hud);
    text-shadow: 0 0 10px var(--hud);
    background: rgba(0,0,0,.7); padding: 6px 14px; border: 1px solid var(--hud);
}
.version-tag { position: absolute; top: 10px; right: 10px; font-family: var(--mono); font-size: .75rem; color: var(--hud-dim); letter-spacing: 1px; }

/* ---------- 面板（四角瞄準框） ---------- */
.box {
    position: relative; border: 1px solid var(--hud-faint); padding: 20px; margin-bottom: 20px;
    width: 90%; max-width: 500px; background: var(--panel); box-sizing: border-box;
}
.box::before, .box::after {
    content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid var(--hud); pointer-events: none;
}
.box::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.box::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.box h3 {
    margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--hud-dim);
    font-family: var(--mono); font-weight: normal; letter-spacing: 2px; color: var(--hud);
}
.box h3 small { color: var(--muted); font-size: .75rem; margin-left: 6px; }

/* ---------- 戰鬥力探測器 ---------- */
.scanner { cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }

.scan-head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .85rem; color: var(--hud); letter-spacing: 2px; }
#scanState { color: var(--aura); }
.scanning #scanState { color: var(--hud); animation: blink .3s steps(2) infinite; }

.reticle {
    position: relative; margin: 14px 0 6px; padding: 22px 10px 16px; text-align: center;
    --c: var(--aura);
    background:
        linear-gradient(var(--c),var(--c)) top left / 24px 2px no-repeat,
        linear-gradient(var(--c),var(--c)) top left / 2px 24px no-repeat,
        linear-gradient(var(--c),var(--c)) top right / 24px 2px no-repeat,
        linear-gradient(var(--c),var(--c)) top right / 2px 24px no-repeat,
        linear-gradient(var(--c),var(--c)) bottom left / 24px 2px no-repeat,
        linear-gradient(var(--c),var(--c)) bottom left / 2px 24px no-repeat,
        linear-gradient(var(--c),var(--c)) bottom right / 24px 2px no-repeat,
        linear-gradient(var(--c),var(--c)) bottom right / 2px 24px no-repeat;
}
.aura {
    position: absolute; left: 50%; top: 55%; width: 85%; height: 140%;
    transform: translate(-50%,-50%); pointer-events: none;
    background: radial-gradient(ellipse at 50% 70%, var(--aura) 0%, transparent 65%);
    filter: blur(18px); opacity: .25; animation: flicker 1.1s ease-in-out infinite alternate;
}
.cp-label { position: relative; font-family: var(--mono); font-size: .8rem; letter-spacing: 4px; color: var(--muted); }
.cp-val {
    position: relative; font-family: var(--digit); font-weight: 900;
    font-size: clamp(2.6rem, 13vw, 3.8rem); line-height: 1.15; color: var(--aura);
    text-shadow: 0 0 10px var(--aura), 0 0 28px var(--aura); font-variant-numeric: tabular-nums;
}
.cp-tier { position: relative; font-family: var(--mono); letter-spacing: 3px; color: var(--aura); font-size: .95rem; }
.scanning .cp-val { color: var(--hud); text-shadow: 0 0 8px var(--hud); animation: jitter .09s infinite; }
.locked .cp-val { animation: lockflash .6s ease-out; }
.over:not(.scanning) .cp-val { animation: glitch 2.4s infinite; }

.scan-bar {
    position: absolute; left: 0; right: 0; top: 0; height: 3px; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, transparent, var(--hud), transparent); box-shadow: 0 0 14px var(--hud);
}
.scanning .scan-bar { opacity: 1; animation: sweep .7s linear infinite; }
.tap-hint { text-align: center; font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-top: 12px; letter-spacing: 1px; }

@keyframes flicker {
    0% { opacity: .16; transform: translate(-50%,-50%) scale(1,1); }
    50% { opacity: .34; transform: translate(-50%,-53%) scale(1.06,1.14); }
    100% { opacity: .22; transform: translate(-50%,-50%) scale(.97,1.03); }
}
@keyframes sweep { from { top: 0; } to { top: 100%; } }
@keyframes jitter { 50% { transform: translateX(1px); } }
@keyframes blink { 50% { opacity: .2; } }
@keyframes lockflash { 0% { filter: brightness(2.2); transform: scale(1.08); } 100% { filter: none; transform: none; } }
@keyframes glitch {
    0%, 88%, 100% { transform: none; clip-path: none; }
    90% { transform: translate(-3px,1px); clip-path: inset(0 0 55% 0); }
    92% { transform: translate(3px,-1px); clip-path: inset(45% 0 0 0); }
    94% { transform: translate(-1px,0); clip-path: none; }
}

/* ---------- 數據 ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; text-align: center; }
.card { background: rgba(0,0,0,.45); padding: 10px; border: 1px solid var(--hud-faint); }
.val { font-family: var(--digit); font-weight: 700; font-size: 1.15rem; color: var(--hud); }
.lbl { font-family: var(--mono); font-size: .78rem; color: var(--muted); margin-top: 3px; }
.lv-row { display: flex; justify-content: space-between; margin-top: 16px; font-family: var(--mono); color: var(--hud); letter-spacing: 1px; }
.days { color: var(--energy); }
.xp-bg { width: 100%; height: 6px; background: rgba(61,255,139,.12); margin-top: 6px; overflow: hidden; }
.xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--hud), var(--energy)); box-shadow: 0 0 10px var(--hud); transition: width .6s; }

/* ---------- 表單 ---------- */
input, select, textarea {
    width: 100%; background: rgba(0,0,0,.55); border: 1px solid var(--hud-dim); color: var(--text);
    padding: 12px; margin-top: 10px; border-radius: 0; box-sizing: border-box; font-size: 16px; -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--hud); box-shadow: 0 0 10px rgba(61,255,139,.35); }
input::placeholder, textarea::placeholder { color: #4d6b58; }
input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1) sepia(1) hue-rotate(80deg); }
button {
    width: 100%; margin-top: 15px; padding: 15px; border: none; cursor: pointer;
    background: var(--energy); color: #120800; font-weight: 800; font-size: 1.05rem; letter-spacing: 1px;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
button:active { filter: brightness(1.25); }
button:disabled { background: #3a3a3a; color: #888; }
.btn-ghost { background: rgba(61,255,139,.12); color: var(--hud); box-shadow: inset 0 0 0 1px var(--hud); }
.btn-dim { background: rgba(255,255,255,.06); color: #aac; box-shadow: inset 0 0 0 1px #445; }
.pass-input { border-color: var(--danger); background: rgba(60,0,0,.5); color: #ffb3b3; letter-spacing: 5px; text-align: center; font-weight: bold; }
.check-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--hud); font-size: .95rem; }
.check-row input { -webkit-appearance: checkbox; appearance: auto; width: 20px; height: 20px; margin: 0; padding: 0; accent-color: var(--hud); }
.sync-row { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
.sync-row b { color: var(--energy); font-weight: normal; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 10px; line-height: 1.6; }

/* ---------- 紀錄 ---------- */
.item { border: 1px solid var(--hud-faint); border-left: 3px solid var(--hud); padding: 14px; margin-top: 12px; background: rgba(0,0,0,.45); }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
.item-date { font-family: var(--mono); color: var(--hud); font-size: 1.05rem; }
.item-date small { color: var(--muted); }
.tag { border: 1px solid var(--hud-dim); color: var(--hud); padding: 2px 6px; font-size: .8rem; white-space: nowrap; }
.src { font-family: var(--mono); font-size: .7rem; padding: 2px 6px; margin-left: 6px; color: var(--energy); border: 1px solid var(--energy); white-space: nowrap; }
.item-info { margin: 5px 0; color: #9db8a6; font-size: .9rem; }
.item-stats { font-family: var(--digit); color: var(--hud); font-size: .85rem; font-weight: 700; }
.item-gain { font-family: var(--digit); color: var(--energy); font-size: .85rem; font-weight: 700; margin-left: 8px; }
.item-break { font-family: var(--mono); color: #120800; background: var(--danger); font-size: .75rem; padding: 1px 6px; margin-left: 8px; animation: blink 1s infinite; }
.item-note { color: var(--text); margin-top: 5px; font-size: .95rem; }
.item img { width: 100%; margin-top: 10px; border: 1px solid var(--hud-faint); display: block; }
.ai-wait {
    margin-top: 10px; height: 140px; border: 1px dashed var(--hud-dim); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); color: var(--hud); font-size: .9rem; letter-spacing: 1px; animation: blink 1.4s infinite;
}
.ai-fail { animation: none; color: var(--danger); border-color: var(--danger); height: auto; min-height: 70px; padding: 12px; flex-direction: column; gap: 6px; text-align: center; }
.ai-fail small { color: #c98; font-size: .72rem; word-break: break-all; }
.item-head { flex-wrap: wrap; }
.src-old { color: var(--muted); border-color: var(--muted); }
.item-feel { color: var(--energy); margin-top: 6px; font-size: .95rem; line-height: 1.5; }
.feel-box { margin-top: 10px; padding: 10px; border: 1px dashed var(--energy); background: rgba(255,157,0,.05); }
.feel-input { min-height: 90px; margin-top: 0; }
.item-btns { display: flex; gap: 8px; margin-top: 10px; }
.item-btns button { margin-top: 0; padding: 10px; font-size: .9rem; }

/* ---------- 留言板 ---------- */
.msg-item { border-bottom: 1px dashed var(--hud-faint); padding: 10px 0; }
.msg-head { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.msg-body { margin-top: 5px; font-size: 1rem; color: var(--text); word-break: break-word; }
.msg-name { color: var(--hud); }

#loading { text-align: center; font-family: var(--mono); color: var(--hud); margin: 10px 0; display: none; animation: blink 1s infinite; }

/* ---------- 戰績卡預覽 ---------- */
#cardModal { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 99; box-sizing: border-box; }
#cardModal img { max-width: 100%; max-height: 68vh; border: 1px solid var(--hud); box-shadow: 0 0 24px rgba(61,255,139,.4); }
.modal-btns { display: flex; gap: 10px; width: 100%; max-width: 400px; }

/* ---------- AI 稱號 ---------- */
.cp-epithet { position: relative; margin-top: 6px; color: var(--text); font-size: .95rem; line-height: 1.5; }
.cp-epithet b { color: var(--aura); text-shadow: 0 0 8px var(--aura); }
.cp-epithet small { display: block; color: var(--muted); font-size: .8rem; }
.retitle { position: relative; width: auto; margin: 8px auto 0; display: block; padding: 4px 12px; font-size: .75rem; font-weight: normal;
    background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--hud-faint); clip-path: none; font-family: var(--mono); }
.pic { position: relative; }
.pic-swap { position: absolute; right: 8px; bottom: 8px; width: auto; margin: 0; padding: 6px 10px; font-size: .75rem;
    background: rgba(0,0,0,.7); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); clip-path: none; }

/* ---------- 進化畫面 ---------- */
.evo { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.97); overflow: hidden; --aura: #3dff8b; }
.evo.open { display: flex; animation: shake .45s 2; }
.evo.open::before { content: ''; position: absolute; inset: 0; background: #fff; pointer-events: none; animation: flash .7s ease-out forwards; }
.evo-burst { position: absolute; left: 50%; top: 45%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax; pointer-events: none;
    background: radial-gradient(circle, var(--aura) 0%, transparent 45%); opacity: .3; animation: burst 1.6s ease-out infinite; }
.evo-rays { position: absolute; left: 50%; top: 45%; width: 200vmax; height: 200vmax; margin: -100vmax 0 0 -100vmax; pointer-events: none; opacity: .18;
    background: repeating-conic-gradient(var(--aura) 0 4deg, transparent 4deg 18deg); animation: spin 12s linear infinite; }
.evo-box { position: relative; text-align: center; width: 90%; max-width: 440px; }
.evo-head { font-family: var(--mono); letter-spacing: 6px; color: var(--aura); font-size: 1.15rem; text-shadow: 0 0 12px var(--aura); animation: blink .45s steps(2) 8; }
.evo-from { font-family: var(--digit); color: var(--muted); font-size: 1.2rem; text-decoration: line-through; margin-top: 20px; }
.evo-arrow { color: var(--aura); letter-spacing: 8px; margin: 6px 0; animation: blink .6s infinite; }
.evo-to { font-family: var(--digit); font-weight: 900; color: var(--aura); line-height: 1.15; text-shadow: 0 0 14px var(--aura), 0 0 44px var(--aura); font-variant-numeric: tabular-nums; }
.evo-gain { font-family: var(--digit); color: var(--energy); margin-top: 8px; font-size: 1rem; }
.evo-label { margin-top: 26px; font-family: var(--mono); letter-spacing: 10px; color: #fff; text-shadow: 0 0 10px #fff; }
.evo-old { color: var(--muted); text-decoration: line-through; margin-top: 10px; }
.evo-new { font-size: 1.9rem; font-weight: 900; margin-top: 4px; text-shadow: 0 0 18px currentColor; animation: pop .8s cubic-bezier(.2,1.7,.4,1) 1.2s both; }
.evo-epithet { margin-top: 10px; color: var(--text); font-size: 1rem; line-height: 1.6; min-height: 1.6em; animation: pop .6s ease-out 1.8s both; }
.evo-epithet b { color: var(--aura); font-size: 1.15rem; }
.evo-box button { margin-top: 26px; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
@keyframes burst { 0% { transform: scale(.25); opacity: .65; } 100% { transform: scale(1.3); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, -2px); } 80% { transform: translate(3px, 4px); } }

/* ---------- 編輯彈窗 ---------- */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 24px 0 40px; z-index: 98; }
.modal.open { display: flex; }
.modal-box { width: 92%; max-width: 480px; margin: 0; }
.e-lbl { display: block; font-family: var(--mono); font-size: .78rem; color: var(--muted); margin-top: 12px; letter-spacing: 1px; }
.e-lbl + input, .e-lbl + select, .e-lbl + textarea { margin-top: 4px; }
.e-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
#e_feel { min-height: 90px; }
.btn-danger { background: rgba(255,59,59,.1); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); font-size: .9rem; padding: 12px; }
.sync-bar .item-btns { margin-top: 10px; }
.item-btns button { flex: 1; white-space: nowrap; padding-left: 4px; padding-right: 4px; }
.item .item-btns button { font-size: .82rem; }
input:disabled { opacity: .45; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="banner">
    <div class="version-tag">v42.0 // POWER SCAN</div>
    <div class="banner-text">TBA360 戰情室</div>
</div>

<div class="box scanner t1" id="scanner" title="點擊重新測量">
    <div class="scan-head"><span>◉ 戰鬥力探測器</span><span id="scanState">STANDBY</span></div>
    <div class="reticle">
        <div class="aura"></div>
        <div class="cp-label">POWER LEVEL · 戰鬥力</div>
        <div class="cp-val" id="cpVal">0</div>
        <div class="cp-tier" id="cpTier">—</div>
        <div class="cp-epithet" id="cpEpithet"></div>
        <button class="retitle" id="btnRetitle" title="重新生成這一階的 AI 稱號">🎲 換一個稱號</button>
    </div>
    <div class="scan-bar"></div>

    <div class="grid">
        <div class="card"><div class="val" id="tDist">0</div><div class="lbl">里程 KM</div></div>
        <div class="card"><div class="val" id="tTime">0</div><div class="lbl">時數 MIN</div></div>
        <div class="card"><div class="val" id="tCal">0</div><div class="lbl">卡路里 KCAL</div></div>
        <div class="card"><div class="val" id="tCount">0</div><div class="lbl">出擊次數</div></div>
    </div>


    <div class="lv-row">
        <span id="lvDisp">Lv.1 騎士</span>
        <span class="days" id="daysDisp">---</span>
    </div>
    <div class="xp-bg"><div class="xp-fill" id="xpBar"></div></div>
    <div class="tap-hint" id="formulaInfo"></div>
    <div class="tap-hint" style="margin-top:4px">[ 點擊探測器重新測量 ]</div>
</div>

<div class="box sync-bar">
    <div class="sync-row">⌚ GARMIN → STRAVA · 每天 23:00 自動同步 · <b id="syncInfo">--</b></div>
    <div class="item-btns">
        <button id="btnSync" class="btn-ghost">🔄 立即同步</button>
        <button id="btnAdd" class="btn-dim">＋ 補登紀錄</button>
    </div>
</div>

<div class="box">
    <h3>◤ 戰鬥紀錄 <small>LOG</small></h3>
    <div id="loading">// SYNCING...</div>
    <div id="list"></div>
</div>

<div class="box">
    <h3>◤ 戰友留言板 <small>COMMS</small></h3>
    <div id="msgList" style="max-height:300px;overflow-y:auto;margin-bottom:10px">
        <div style="color:var(--muted);text-align:center">暫無留言</div>
    </div>
    <div style="border-top:1px dashed var(--hud-faint);padding-top:10px">
        <input type="text" id="m_name" placeholder="您的暱稱" maxlength="20">
        <input type="text" id="m_text" placeholder="寫句加油的話..." maxlength="200">
        <button id="btnMsg" class="btn-ghost">📢 發送留言</button>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="box modal-box">
        <h3 id="e_title">◤ 編輯紀錄</h3>
        <div id="e_src" class="sync-row"></div>
        <label class="e-lbl">日期</label>
        <input type="date" id="e_date">
        <label class="e-lbl">運動類型</label>
        <select id="e_type">
            <option>🚴 騎行</option><option>🚶 快走</option><option>🏃 跑步</option>
            <option>🏀 打球</option><option>🏋️ 重訓</option><option>🏊 游泳</option>
            <option>🛌 休息</option><option>🏅 其他</option>
        </select>
        <div class="e-grid">
            <div><label class="e-lbl">里程 km</label><input type="number" id="e_dist" step="0.01"></div>
            <div><label class="e-lbl">時間 min</label><input type="number" id="e_time" step="1"></div>
            <div><label class="e-lbl">卡路里</label><input type="number" id="e_cal" step="1"></div>
        </div>
        <label class="e-lbl">標題</label>

<script>
// ▼ 設定區 ▼（密碼在後端的指令碼屬性 ADMIN_PASS）
var GAS_URL = "https://script.google.com/macros/s/AKfycbxjbykUNcsRwXiHqNVQ8JjjgDQ2YpDG4CFgiMxrb6mdypln84A3rtHvXy7BoJAwxn9S/exec";
var KEY = "TBA360_V38";
var GOAL_DATE = new Date(2026, 10, 13);

// ── 戰鬥力公式（只用 Strava 會自動帶進來的欄位：卡路里、爬升、距離、時間、類型）──
// 從 START_DATE 起算，起始戰鬥力 START_CP
// 修行值 = 卡路里 + 爬升公尺（沒有卡路里時用 分鐘×8 估算）
//        + 極限突破 BREAK_XP（騎車 ≥100km、跑步 ≥21km、或任何運動 ≥180 分鐘）
//        + 傳說突破（單趟騎車 ≥300km，例如一日北高；獎勵大小由校準決定）
// 戰鬥力 = START_CP × 係數 ^ (累積修行值 / 1000)
// 自動校準兩個點：
//   1. CALIB_TIME 這一刻的戰鬥力 = CALIB_NOW
//   2. 之後照賽前訓練 PLAN_XP 再騎完北高，戰鬥力 = CALIB_FINAL（晉升【北高傳說】）
var START_DATE = '2026-01-01';
var START_CP = 5;
var BREAK_XP = 5000;
var CALIB_TIME = '2026-10-31 23:59';
var CALIB_NOW = 3000000;
var CALIB_FINAL = 1.5e8;
var PLAN_XP = 1 * (2800 + 600 + BREAK_XP) + 3 * 500;     // 賽前預估：1 次百公里 + 3 次一般訓練
var FINALE_BASE_XP = 9000 + 1500 + BREAK_XP;              // 北高本身：約 9,000 大卡、1,500m 爬升
var GROWTH = null;   // 想固定係數就填數字

// 等級：戰鬥力每升一個數量級進一階（共 12 階）[門檻（未滿）, 氣場顏色]
// 每一階的稱號由 AI 生成（探測器下方的 🎲 可以換一個）
var TITLES = [
    [1e2, '#9fe8ff'], [1e3, '#9fe8ff'], [1e4, '#3dff8b'], [1e5, '#3dff8b'],
    [1e6, '#ffe14d'], [1e7, '#ffe14d'], [1e8, '#ff9d00'], [1e9, '#ff9d00'],
    [1e10, '#ff3b3b'], [1e11, '#ff3b3b'], [1e12, '#d070ff'], [Infinity, '#ffffff']
];
function stageName(ti) { return '第 ' + (ti + 1) + ' 階'; }
function stageLabel(ti) { return TITLE_AI[ti] ? TITLE_AI[ti].title : stageName(ti); }
// 單次運動的等級（戰績卡）：依修行值 [門檻（未滿）, 名稱, 顏色]
var ACT_TIERS = [[300, '熱身', '#9fe8ff'], [600, '認真', '#3dff8b'], [1200, '全力', '#ffe14d'], [2500, '爆發', '#ff9d00'], [Infinity, '極限突破', '#ff3b3b']];
// ▲ 設定區 ▲

var LOGS = [];
var curLv = 1, curCP = 0, shownCP = null;
var pollTimer = null, scanRaf = null, audioCtx = null;
var cardBlob = null, cardName = '';

window.onload = function () {
    $('daysDisp').innerText = daysLeft() + " DAYS LEFT";

    loadLocal();
    loadCloud();

    $('scanner').onclick = function () { scanTo(curCP, true); };
    $('btnSync').onclick = syncNow;
    $('btnRetitle').onclick = function (e) { e.stopPropagation(); retitle(); };
    $('btnAdd').onclick = function () { openEdit(null); };
    $('e_save').onclick = saveEdit;
    $('e_cancel').onclick = closeEdit;
    $('e_hide').onclick = hideRecord;
    $('editModal').onclick = function (e) { if (e.target === this) closeEdit(); };
    $('btnMsg').onclick = sendMsg;
    $('list').onclick = onListClick;
    $('btnShare').onclick = shareCard;
    $('btnDl').onclick = downloadCard;
    $('btnClose').onclick = closeCard;
    $('evoOk').onclick = function () { $('evoModal').classList.remove('open'); };
};

/* ---------- 小工具 ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function localDate() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
}
function daysLeft() {
    var d = Math.floor((GOAL_DATE - new Date()) / 86400000);
    return d > 0 ? d : 0;
}
function num(v) { return parseFloat(v) || 0; }
function isPending(item) { return item.aiStatus === 'pending'; }
function tierIndex(v, tiers) { for (var i = 0; i < tiers.length; i++) if (v < tiers[i][0]) return i; return tiers.length - 1; }

/* ---------- 戰鬥力公式 ---------- */
function isLegend(item) { return /騎行/.test(item.type || '') && num(item.dist) >= 300; }
function isBreak(item) {
    var t = item.type || '', d = num(item.dist), m = num(item.time);
    return (/騎行/.test(t) && d >= 100) || (/跑步/.test(t) && d >= 21) || (item.type !== '🛌 休息' && m >= 180);
}
function xpOf(item) {
    return xpBase(item) + (isLegend(item) ? curLegendXP : 0);
}
// 不含傳說突破的修行值（校準用）
function xpBase(item) {
    if (item.type === '🛌 休息' || (item.date || '') < START_DATE) return 0;
    var cal = num(item.cal) || num(item.time) * 8;
    return cal + num(item.elev) + (isBreak(item) ? BREAK_XP : 0);
}
function tkey(item) { return (item.date || '') + ' ' + (item.start || '00:00'); }

var curG = 1, curLegendXP = 5000;
// 依時間順序累加修行值，算出每筆運動前後的戰鬥力
function computeCP(list) {
    var sorted = list.slice().sort(function (a, b) { return tkey(a) < tkey(b) ? -1 : tkey(a) > tkey(b) ? 1 : 0; });
    var histXP = 0;
    sorted.forEach(function (it) { if (tkey(it) <= CALIB_TIME) histXP += xpBase(it); });
    // 校準 1：START_CP × G^(歷史/1000) = CALIB_NOW
    curG = GROWTH || (histXP >= 1000 ? Math.exp(Math.log(CALIB_NOW / START_CP) / (histXP / 1000)) : 1.3);
    var lnG = Math.log(curG);
    // 校準 2：CALIB_NOW × G^((特訓 + 北高 + 傳說突破)/1000) = CALIB_FINAL → 解出傳說突破的獎勵
    curLegendXP = Math.max(5000, 1000 * (Math.log(CALIB_FINAL / CALIB_NOW) / lnG) - PLAN_XP - FINALE_BASE_XP);
    var acc = 0;
    sorted.forEach(function (it) {
        var xp = xpOf(it);
        it._xp = xp;
        it._break = xp > 0 && isBreak(it);
        if (!xp) { it._multi = 1; it._gain = 0; it._cp = beforeStart(it) ? null : Math.round(START_CP * Math.exp(acc)); return; }
        var before = START_CP * Math.exp(acc);
        acc += lnG * xp / 1000;
        it._multi = Math.exp(lnG * xp / 1000);
        it._cp = Math.round(START_CP * Math.exp(acc));
        it._gain = Math.floor(it._cp - before);
    });
    return Math.round(START_CP * Math.exp(acc));
}
function beforeStart(it) { return (it.date || '') < START_DATE; }
function actInfo(item) {
    if (isLegend(item)) return { label: '傳說突破', color: '#d070ff' };
    var t = item._break ? ACT_TIERS[4] : ACT_TIERS[tierIndex(item._xp || 0, ACT_TIERS)];
    return { label: t[1], color: t[2] };
}
function titleIndex(cp) { return tierIndex(cp, TITLES); }
function fmtMulti(m) { return m < 100 ? m.toFixed(2) : Math.round(m).toLocaleString(); }

// 依可用寬度自動縮放大數字
function setCPText(text) {
    var el = $('cpVal');
    el.innerText = text;
    var w = el.parentElement.clientWidth - 24;
    el.style.fontSize = Math.max(26, Math.min(62, w / (text.length * 0.8))) + 'px';
}
function post(obj) {
    return fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(obj)
    }).then(function (r) { return r.json(); });
}
function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) {
        setTimeout(function () { rej(new Error('等候逾時，紀錄可能已經存進去了，稍後重新整理看看')); }, ms);
    })]);
}
// 密碼只記在這次開著的頁面裡，不存檔；第一次用時才詢問
var sessionPass = '';
function getPass() {
    if (sessionPass) return sessionPass;
    var p = prompt("請輸入管理密碼");
    return p || '';
}
function imgSrc(v) {
    v = String(v || '');
    if (/^(data:image\/|https?:\/\/)/.test(v)) return v;
    return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(v) + '&sz=w1080';
}
function imgTag(v, alt) {
    v = String(v || '');
    var fb = /^(data:|https?:)/.test(v) ? '' :
        ' onerror="this.onerror=null;this.src=\'https://lh3.googleusercontent.com/d/' + esc(encodeURIComponent(v)) + '=w1080\'"';
    return '<img src="' + esc(imgSrc(v)) + '" loading="lazy" alt="' + alt + '"' + fb + '>';
}

/* ---------- 戰鬥力掃描動畫 ---------- */
function beep(freq, dur, vol) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}

function scanTo(target, withSound, from) {
    var sc = $('scanner');
    if (withSound) {
        try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
    }
    cancelAnimationFrame(scanRaf);
    var ti = titleIndex(target), top = ti === TITLES.length - 1;
    sc.style.setProperty('--aura', TITLES[ti][1]);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var finish = function () {
        setCPText(target.toLocaleString());
        sc.className = 'box scanner locked' + (top ? ' over' : '');
        $('scanState').innerText = top ? 'OVERLOAD' : 'LOCKED';
        $('cpTier').innerText = '【' + stageName(ti) + ' / 12】';
        showEpithet(ti);
        if (withSound && audioCtx) { beep(1320, .08, .05); setTimeout(function () { beep(1760, .18, .05); }, 90); }
        shownCP = target;
    };
    if (reduce) { finish(); return; }

    sc.className = 'box scanner scanning';
    $('scanState').innerText = 'SCANNING';
    $('cpTier').innerText = '測量中…';
    var climb = from != null && from < target;   // 有上次的數值：從那裡往上衝
    var digits = Math.max(1, String(target).length), t0 = performance.now(), dur = climb ? 2400 : 1700, lastBeep = 0;
    var step = function (now) {
        var t = now - t0;
        if (t >= dur) { finish(); return; }
        var shown;
        if (climb) {
            var k = t / dur;
            k = 1 - Math.pow(1 - k, 3);
            shown = Math.floor(from * Math.pow(target / from, k));   // 用倍率插值，看起來像指數暴衝
        } else if (t < dur * 0.55) {
            shown = Math.floor(Math.random() * Math.pow(10, digits));   // 前段：亂數狂跳
        } else {
            var k2 = (t - dur * 0.55) / (dur * 0.45);
            k2 = 1 - Math.pow(1 - k2, 3);
            shown = Math.floor(target * k2 + Math.random() * target * (1 - k2) * 0.3);
        }
        setCPText(shown.toLocaleString());
        if (withSound && t - lastBeep > 110) { beep(880 + Math.random() * 600, .03); lastBeep = t; }
        scanRaf = requestAnimationFrame(step);
    };
    scanRaf = requestAnimationFrame(step);
}

/* ---------- AI 稱號 ---------- */
var TITLE_AI = {}, titleAsked = {};
function epithetHtml(t) { return t ? '<b>「' + esc(t.title) + '」</b>' + (t.line ? '<small>' + esc(t.line) + '</small>' : '') : ''; }
function showEpithet(ti) {
    $('cpEpithet').innerHTML = epithetHtml(TITLE_AI[ti]);
    if (!TITLE_AI[ti]) askTitle(ti);
}
// 這一階還沒有 AI 稱號時，請後端生成（每一階只會生成一次，所有人看到的都一樣）
function askTitle(ti, cb) {
    if (TITLE_AI[ti]) { if (cb) cb(TITLE_AI[ti]); return; }
    if (titleAsked[ti]) return;
    titleAsked[ti] = true;
    var recent = LOGS.slice(0, 3).map(function (x) {
        return { type: x.type, dist: x.dist, words: x.feel || x.note || '' };
    });
    post({ action: 'title', tier: ti, base: stageName(ti), cp: curCP, recent: recent })
        .then(function (d) {
            if (!d.ok || !d.title) return;
            TITLE_AI[ti] = d.title;
            if (titleIndex(curCP) === ti) $('cpEpithet').innerHTML = epithetHtml(d.title);
            if (cb) cb(d.title);
        })
        .catch(function () {});
}

/* ---------- 進化畫面 ---------- */
function retitle() {
    var pass = getPass();
    if (!pass) return;
    var ti = titleIndex(curCP), btn = $('btnRetitle');
    btn.disabled = true;
    btn.innerText = '🎲 AI 命名中…';
    post({ action: 'retitle', pass: pass, tier: ti, base: stageName(ti), cp: curCP,
           recent: LOGS.slice(0, 3).map(function (x) { return { type: x.type, dist: x.dist, words: x.feel || x.note || '' }; }) })
        .then(function (d) {
            if (d.err === '密碼錯誤') { sessionPass = ''; alert('❌ 密碼錯誤'); return; }
            if (!d.ok) { alert('❌ ' + (d.err || '命名失敗')); return; }
            sessionPass = pass;
            TITLE_AI[ti] = d.title;
            $('cpEpithet').innerHTML = epithetHtml(d.title);
        })
        .catch(function (e) { alert('⚠️ ' + e.message); })
        .then(function () { btn.disabled = false; btn.innerText = '🎲 換一個稱號'; });
}

var SEEN_KEY = KEY + '_seen';
function loadSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || 'null'); } catch (e) { return null; } }
function saveSeen(cp) { try { localStorage.setItem(SEEN_KEY, JSON.stringify({ cp: cp })); } catch (e) {} }

function checkEvolution() {
    var seen = loadSeen();
    if (seen && seen.cp > 0 && curCP > seen.cp) showEvo(seen.cp, curCP);
    saveSeen(curCP);
}

function countUp(el, from, to, dur) {
    var t0 = performance.now();
    var fit = function (txt) {
        el.innerText = txt;
        el.style.fontSize = Math.max(26, Math.min(64, (el.parentElement.clientWidth - 10) / (txt.length * 0.8))) + 'px';
    };
    var step = function (now) {
        var k = Math.min(1, (now - t0) / dur);
        k = 1 - Math.pow(1 - k, 3);
        fit(Math.floor(from * Math.pow(to / from, k)).toLocaleString());
        if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

function fanfare() {
    if (!audioCtx) return;
    [523, 659, 784, 1047, 1319].forEach(function (f, i) { setTimeout(function () { beep(f, .14, .05); }, i * 110); });
}

function showEvo(from, to) {
    var oldT = titleIndex(from), newT = titleIndex(to), up = newT > oldT;
    var m = $('evoModal');
    m.style.setProperty('--aura', TITLES[newT][1]);
    $('evoFrom').innerText = from.toLocaleString();
    $('evoGain').innerText = '+' + (to - from).toLocaleString() + '（×' + fmtMulti(to / from) + '）';
    $('evoTitleWrap').style.display = up ? '' : 'none';
    if (up) {
        $('evoOld').innerText = '【' + stageLabel(oldT) + '】';
        $('evoNew').innerText = '【' + stageName(newT) + '】';
        $('evoNew').style.color = TITLES[newT][1];
        $('evoEpithet').innerHTML = TITLE_AI[newT] ? epithetHtml(TITLE_AI[newT]) : '<small style="color:var(--muted)">AI 正在為你命名…</small>';
        askTitle(newT, function (t) { $('evoEpithet').innerHTML = epithetHtml(t); });
    }
    m.classList.remove('open'); void m.offsetWidth; m.classList.add('open');
    countUp($('evoTo'), from, to, 2200);
    fanfare();
}

/* ---------- 讀取 ---------- */
function loadLocal() {
    try { render(JSON.parse(localStorage.getItem(KEY) || "[]")); }
    catch (e) { console.error("Local load error", e); }
}

function loadCloud() {
    $('loading').style.display = 'block';
    return fetch(GAS_URL)
        .then(function (r) { return r.json(); })
        .then(function (d) {
            $('loading').style.display = 'none';
            if (d.ok === false) { console.warn(d.err); return; }
            renderMsgs(d.msgs || []);
            $('syncInfo').innerText = d.lastSync ? '上次 ' + d.lastSync : '尚未同步';
            TITLE_AI = d.titles || {};
            if (d.logs) {
                try {
                    var slim = d.logs.slice(0, 60).map(function (l) {
                        return Object.assign({}, l, { img: /^data:/.test(l.img || '') ? '' : l.img });
                    });
                    localStorage.setItem(KEY, JSON.stringify(slim));
                } catch (e) { console.warn("LocalStorage 寫入失敗", e); }
                render(d.logs, true);
            }
        })
        .catch(function (e) {
            $('loading').style.display = 'none';
            console.log("Cloud Err:", e);
        });
}

/* ---------- 編輯 / 補登彈窗 ---------- */
var editing = null;   // null = 補登新紀錄；否則是正在編輯的那筆

function openEdit(item) {
    editing = item;
    var add = !item;
    $('e_title').innerText = add ? '◤ 補登紀錄' : '◤ 編輯紀錄';
    $('e_src').innerText = add ? '沒戴錶的運動用這裡補登' :
        (item.source === 'strava' ? '⌚ 來自 Strava' + (item.device ? '（' + item.device + '）' : '') + '，日期以 Strava 為準' :
         item.source === 'legacy' ? '舊系統紀錄' : '手動補登的紀錄');
    $('e_date').value = add ? localDate() : (item.date || '');
    $('e_date').disabled = !add && item.source === 'strava';
    $('e_type').value = add ? '🚴 騎行' : (item.type || '🏅 其他');
    $('e_dist').value = add ? '' : (item.dist || '');
    $('e_time').value = add ? '' : (item.time || '');
    $('e_cal').value = add ? '' : (item.cal || '');
    $('e_note').value = add ? '' : (item.note || '');
    $('e_feel').value = add ? '' : (item.feel || '');
    $('e_file').value = '';
    $('e_ai').checked = false;
    $('e_pass').value = sessionPass;
    $('e_pass').style.display = sessionPass ? 'none' : '';
    $('e_hide').style.display = add ? 'none' : '';
    $('e_save').disabled = false; $('e_save').innerText = '💾 儲存';
    $('editModal').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeEdit() {
    $('editModal').classList.remove('open');
    document.body.style.overflow = '';
    editing = null;
}

function saveEdit() {
    var pass = sessionPass || $('e_pass').value;
    if (!pass) { alert("請輸入管理密碼"); $('e_pass').focus(); return; }
    var wantAI = $('e_ai').checked;
    var btn = $('e_save');
    btn.disabled = true;
    btn.innerText = "儲存中...";

    var fields = {
        date: $('e_date').value, type: $('e_type').value,
        dist: $('e_dist').value, time: $('e_time').value, cal: $('e_cal').value,
        note: $('e_note').value.trim(), feel: $('e_feel').value.trim()
    };
    var file = $('e_file').files[0];
    var prep = file ? (btn.innerText = "壓縮照片中...", resizeImg(file)) : Promise.resolve("");

    prep.then(function (img64) {
        btn.innerText = wantAI ? "儲存並繪圖中，約 20–40 秒..." : "儲存中...";
        var body = editing
            ? { action: 'edit', pass: pass, id: editing.id, fields: fields, img: img64, ai: wantAI }
            : { action: 'log', pass: pass, date: fields.date, type: fields.type, dist: fields.dist, time: fields.time,
                cal: fields.cal, note: fields.note, feel: fields.feel, img: img64, ai: wantAI };
        return withTimeout(post(body), wantAI ? 150000 : 40000);
    }).then(function (d) {
        if (d.err === '密碼錯誤') { alert("❌ 密碼錯誤"); sessionPass = ''; $('e_pass').style.display = ''; return; }
        if (!d.ok) { alert("❌ " + (d.err || "儲存失敗")); return; }
        sessionPass = pass;
        if (wantAI && d.ai && !d.ai.ok) alert("✅ 已儲存，但生圖失敗：" + (d.ai.err || ''));
        closeEdit();
        loadCloud();
    }).catch(function (e) {
        alert("⚠️ " + e.message);
    }).then(function () {
        btn.disabled = false;
        btn.innerText = "💾 儲存";
    });
}

function hideRecord() {
    if (!editing) return;
    if (!confirm("確定要隱藏這筆紀錄？隱藏後不會顯示，也不計入戰鬥力（資料仍保留在試算表）。")) return;
    var pass = sessionPass || $('e_pass').value;
    if (!pass) { alert("請輸入管理密碼"); $('e_pass').focus(); return; }
    post({ action: 'edit', pass: pass, id: editing.id, hide: true })
        .then(function (d) {
            if (!d.ok) { alert("❌ " + (d.err || "隱藏失敗")); return; }
            sessionPass = pass;
            closeEdit();
            loadCloud();
        })
        .catch(function (e) { alert("⚠️ " + e.message); });
}

function resizeImg(file) {
    return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
            var max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("圖片載入錯誤")); };
        img.src = url;
    });
}

/* ---------- 同步 / 重新生圖 ---------- */
function syncNow() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
    var pass = getPass();
    if (!pass) return;
    var btn = $('btnSync');
    btn.disabled = true;
    btn.innerText = "同步中...";
    withTimeout(post({ action: 'sync', pass: pass }), 300000)
        .then(function (d) {
            var m = [];
            if (d.err) m.push("⚠️ " + d.err);
            if (d.note) m.push("ℹ️ " + d.note);
            if (d.added != null) m.push("✅ 新增 " + d.added + " 筆運動" + (d.dup ? "，隱藏重複 " + d.dup + " 筆" : "") +
                (d.merged ? "，合併舊紀錄 " + d.merged + " 筆" : ""));
            if (d.remaining) m.push("⏳ 還有 " + d.remaining + " 筆舊活動沒抓完，等 15 分鐘再按一次（或讓排程自己補）");
            alert(m.join("\n"));
            loadCloud();
        })
        .catch(function (e) { alert("⚠️ " + e.message); })
        .then(function () { btn.disabled = false; btn.innerText = "🔄 立即同步"; });
}

function onListClick(e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var i = +b.dataset.i, item = LOGS[i];
    if (!item) return;
    var act = b.dataset.act;
    if (act === 'card') openCard(item, b);
    if (act === 'edit') openEdit(item);
    if (act === 'swap') { item._showAI = !item._showAI; $('list').innerHTML = LOGS.map(itemHtml).join(''); }
    if (act === 'feel') toggleFeel(i, true);
    if (act === 'feel-cancel') toggleFeel(i, false);
    if (act === 'feel-go') genWithFeel(item, i, b);
}

// 感言輸入框
function toggleFeel(i, open) {
    var box = $('feel-' + i);
    if (!box) return;
    box.style.display = open ? 'block' : 'none';
    if (open) {
        var p = box.querySelector('.feel-pass');
        if (!p.value) p.value = sessionPass;
        p.style.display = sessionPass ? 'none' : '';
        box.querySelector('textarea').focus();
    }
}

function genWithFeel(item, i, btn) {
    var box = $('feel-' + i);
    var feel = box.querySelector('textarea').value.trim();
    var pass = sessionPass || box.querySelector('.feel-pass').value;
    if (!pass) { alert("請輸入密碼"); box.querySelector('.feel-pass').focus(); return; }
    if (!feel && !confirm("沒有寫感言，要用預設情境生圖嗎？")) return;
    btn.disabled = true;
    btn.innerText = "🎨 繪製中，約 20–40 秒...";
    withTimeout(post({ action: 'gen', pass: pass, id: item.id, feel: feel }), 150000)
        .then(function (d) {
            if (d.err === '密碼錯誤') { alert("❌ 密碼錯誤"); sessionPass = ''; box.querySelector('.feel-pass').style.display = ''; return; }
            sessionPass = pass;
            if (!d.ok) alert("❌ 生圖失敗：" + (d.err || ''));
            loadCloud();
        })
        .catch(function (e) { alert("⚠️ " + e.message); })
        .then(function () { btn.disabled = false; btn.innerText = "✨ 依感言生圖"; });
}

/* ---------- 留言 ---------- */
function sendMsg() {
    var name = $('m_name').value.trim();

    if (!name || !text) { alert("請輸入暱稱和內容"); return; }

            : item.source === 'legacy' ? '<span class="src src-old">舊紀錄</span>' : '';

    var feelBox = item.id ? '<div class="feel-box" id="feel-' + i + '" style="display:none">' +
        '<textarea class="feel-input" maxlength="300" placeholder="寫下這趟的感言，AI 會照內容畫成點陣圖（有照片會參考照片）。例：逆風騎到淡水，夕陽超美但大腿快廢了">' + esc(item.feel || '') + '</textarea>' +
        '<input type="password" class="pass-input feel-pass" placeholder="密碼">' +
        '<div class="item-btns"><button data-act="feel-go" data-i="' + i + '">✨ 依感言生圖</button>' +

        '<span><span class="tag">' + esc(item.type) + '</span>' + src + '</span></div>' +
        (info.length ? '<div class="item-info">' + info.join(' | ') + '</div>' : '') +
        (stats || gain ? '<div><span class="item-stats">' + stats + '</span>' + (gain ? '<span class="item-gain">+' + gain.toLocaleString() + ' CP' + multi + '</span>' : '') +
            (item._break ? '<span class="item-break">⚡極限突破</span>' : '') + '</div>' : '') +

        ai +

}

function render(list, fromCloud) {
    // 只顯示一日北高挑戰起算日（START_DATE）之後的紀錄
    LOGS = (list || []).filter(function (x) { return (x.date || '') >= START_DATE; });
    var cDist = 0, cTime = 0, cCal = 0, cCount = 0, anyPending = false;

    curCP = computeCP(LOGS);

    LOGS.forEach(function (item) {
        if (item.type !== "🛌 休息") {
            cCount++;
            cDist += num(item.dist);
            cTime += num(item.time);
            cCal += num(item.cal);
        }
        if (isPending(item)) anyPending = true;
    });

    curLv = Math.floor(cCount / 5) + 1;

    $('formulaInfo').innerText = '自 ' + START_DATE.slice(5).replace('-', '/') + ' 起算 · 每千修行值 ×' + curG.toFixed(3);

    $('list').innerHTML = LOGS.map(itemHtml).join('') || '<div style="color:var(--muted);text-align:center">還沒有紀錄</div>';

    $('tDist').innerText = cDist.toFixed(1);
    $('tTime').innerText = Math.round(cTime);
    $('tCal').innerText = Math.round(cCal);
    $('tCount').innerText = cCount;
    $('lvDisp').innerText = "Lv." + curLv + " 騎士";
    $('xpBar').style.width = (cCount % 5) * 20 + "%";

    // 數值有變才重新掃描；雲端資料比上次看到的高，就從上次的數值往上衝
    if (curCP !== shownCP) {
        var seen = fromCloud ? loadSeen() : null;
        scanTo(curCP, false, seen && seen.cp > 0 && seen.cp < curCP ? seen.cp : null);
    }
    if (fromCloud) checkEvolution();


    // 還有圖在排隊時，每 2 分鐘自動刷新一次
    clearTimeout(pollTimer);
    if (anyPending) schedulePoll();
}

// 有圖在繪製時，每 2 分鐘刷新；正在輸入感言時先不刷新，免得打到一半的字被清掉
function schedulePoll() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(function () {
        var typing = document.activeElement && $('list').contains(document.activeElement);
        if (!document.hidden && !typing) loadCloud(); else schedulePoll();
    }, 120000);
}

/* ---------- 戰績卡（AI 圖 + 探測器數據） ---------- */
function loadImage(src) {
    return new Promise(function (resolve, reject) {
        var im = new Image();
        im.onload = function () { resolve(im); };
        im.onerror = function () { reject(new Error('背景圖載入失敗')); };
        im.src = src;
    });
}

function openCard(item, btn) {
    var old = btn.innerText;
    btn.disabled = true;
    btn.innerText = "測量中...";

    var srcId = (item.img && !item._showAI) ? item.img : (item.aiImg || item.img || '');
    var getBg;
    if (/^data:image\//.test(srcId)) getBg = Promise.resolve(srcId);
    else if (srcId && !/^https?:/.test(srcId)) {
        // 透過後端取得圖片資料，canvas 才能匯出
        getBg = fetch(GAS_URL + '?action=img&id=' + encodeURIComponent(srcId))
            .then(function (r) { return r.json(); })
            .then(function (j) { return j.ok ? j.data : null; });
    } else getBg = Promise.resolve(null);

    var fonts = document.fonts ? Promise.all([
        document.fonts.load('900 120px Orbitron'),
        document.fonts.load('700 60px Orbitron'),
        document.fonts.load('30px "Share Tech Mono"')
    ]).catch(function () {}) : Promise.resolve();

    Promise.all([getBg.then(function (data) { return data ? loadImage(data) : null; }).catch(function () { return null; }), fonts])
        .then(function (res) {
            var canvas = drawCard(item, res[0]);
            return new Promise(function (r) { canvas.toBlob(r, 'image/jpeg', 0.92); });
        })
        .then(function (blob) {
            cardBlob = blob;
            cardName = 'TBA360_' + item.date + '.jpg';
            $('cardImg').src = URL.createObjectURL(blob);
            $('cardModal').style.display = 'flex';
        })
        .catch(function (e) { alert("戰績卡生成失敗：" + e.message); })
        .then(function () { btn.disabled = false; btn.innerText = old; });
}

function drawCard(item, bg) {
    var W = 1080, H = 1350;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var x = c.getContext('2d');
    var F = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif';
    var D = 'Orbitron,"Share Tech Mono",monospace';
    var MONO = '"Share Tech Mono",ui-monospace,monospace';
    var HUD = '#3dff8b';
    if (item._cp == null) computeCP(LOGS);
    var gain = item._gain || 0;
    var info = actInfo(item);
    var AURA = info.color;

    function glow(color, blur) { x.shadowColor = color; x.shadowBlur = blur; }
    function noGlow() { x.shadowBlur = 0; }
    function clip(text, maxW) {
        text = String(text);
        if (x.measureText(text).width <= maxW) return text;
        while (text.length && x.measureText(text + '…').width > maxW) text = text.slice(0, -1);
        return text + '…';
    }
    function bracket(x0, y0, x1, y1, len, color, w) {
        x.strokeStyle = color; x.lineWidth = w;
        [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(function (p) {
            x.beginPath();
            x.moveTo(p[0] + p[2] * len, p[1]); x.lineTo(p[0], p[1]); x.lineTo(p[0], p[1] + p[3] * len);
            x.stroke();
        });
    }

    // 背景圖
    if (bg) {
        var k = Math.max(W / bg.width, H / bg.height);
        x.drawImage(bg, (W - bg.width * k) / 2, (H - bg.height * k) / 2, bg.width * k, bg.height * k);
    } else {
        var g0 = x.createRadialGradient(W / 2, 520, 50, W / 2, 520, 700);
        g0.addColorStop(0, AURA); g0.addColorStop(.35, '#06210f'); g0.addColorStop(1, '#000');
        x.fillStyle = g0; x.fillRect(0, 0, W, H);
    }
    // 探測器綠色濾鏡 + 掃描線 + 暗角
    x.fillStyle = 'rgba(40,255,120,0.07)'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(0,0,0,0.16)';
    for (var sy = 0; sy < H; sy += 4) x.fillRect(0, sy, W, 1);
    var vg = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    x.fillStyle = vg; x.fillRect(0, 0, W, H);
    var gt = x.createLinearGradient(0, 0, 0, 200);
    gt.addColorStop(0, 'rgba(0,0,0,.75)'); gt.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gt; x.fillRect(0, 0, W, 200);
    var gb = x.createLinearGradient(0, 760, 0, H);
    gb.addColorStop(0, 'rgba(0,0,0,0)'); gb.addColorStop(.3, 'rgba(0,0,0,.85)'); gb.addColorStop(1, 'rgba(0,0,0,.97)');
    x.fillStyle = gb; x.fillRect(0, 760, W, H - 760);

    // 頂部 HUD
    glow(HUD, 14);
    x.fillStyle = HUD; x.font = '34px ' + MONO;
    x.fillText('◉ 戰鬥力探測器 // TBA360', 50, 80);
    x.textAlign = 'right';
    x.fillText(item.date + (item.start ? '  ' + item.start : ''), W - 50, 80);
    x.textAlign = 'left';
    x.fillRect(50, 102, W - 100, 2);
    noGlow();

    // 鎖定框
    glow(AURA, 16);
    bracket(150, 200, W - 150, 740, 70, AURA, 5);
    noGlow();
    x.fillStyle = AURA; x.font = '26px ' + MONO;
    x.fillText('TARGET LOCKED', 162, 236);
    x.textAlign = 'right';
    x.fillText('LV.' + curLv, W - 162, 236);
    x.textAlign = 'left';

    // 類型與心得
    var y = 860;
    x.fillStyle = '#fff'; x.font = '800 46px ' + F;
    x.fillText(item.type || '', 50, y);
    var line = item.feel ? '「' + item.feel + '」' : item.note;
    if (line) {
        x.fillStyle = item.feel ? '#ffc56b' : '#cfe9d8'; x.font = '400 30px ' + F;
        x.fillText(clip(line, W - 100), 50, y + 48);
    }

    // 戰鬥力讀數
    x.fillStyle = HUD; x.font = '28px ' + MONO;
    x.fillText('POWER LEVEL  戰鬥力', 50, y + 112);
    x.textAlign = 'right'; x.fillStyle = AURA;
    x.fillText('【' + info.label + '】', W - 50, y + 112);
    x.textAlign = 'left';
    // 大字：這次運動後的總戰鬥力（自動縮到放得下）
    var cpText = item._cp == null ? '—' : item._cp.toLocaleString();
    var fs = 120;
    x.font = '900 ' + fs + 'px ' + D;
    while (fs > 60 && x.measureText(cpText).width > W - 100) { fs -= 4; x.font = '900 ' + fs + 'px ' + D; }
    glow(AURA, 34);
    x.fillStyle = AURA;
    x.fillText(cpText, 46, y + 222);
    glow(AURA, 12);
    x.fillText(cpText, 46, y + 222);
    noGlow();
    // 小字：這次增加多少、倍率
    x.fillStyle = '#ff9d00'; x.font = '700 34px ' + D;
    var gainText = '+' + gain.toLocaleString() + '  ×' + (item._multi || 1).toFixed(2);
    x.fillText(gainText, 50, y + 270);
    if (item._break) {
        var gw = x.measureText(gainText).width;
        x.fillStyle = '#ff3b3b'; x.font = '800 30px ' + F;
        x.fillText('⚡ 極限突破', 50 + gw + 24, y + 268);
    }

    // 數據列
    var cols = [];
    if (item.dist) cols.push([num(item.dist).toFixed(1), 'KM 公里']);
    cols.push([String(Math.round(num(item.time))), 'MIN 分鐘']);
    cols.push([String(Math.round(num(item.cal))), 'KCAL 卡路里']);
    if (cols.length < 3 && item.hr) cols.push([String(item.hr), 'BPM 心率']);
    x.fillStyle = 'rgba(61,255,139,.35)'; x.fillRect(50, 1148, W - 100, 1);
    cols.forEach(function (cv, i) {
        var cx = 50 + i * 340;
        x.fillStyle = HUD; x.font = '700 58px ' + D;
        x.fillText(cv[0], cx, 1208);
        x.fillStyle = '#86a892'; x.font = '24px ' + MONO;
        x.fillText(cv[1], cx, 1244);
    });

    // 底部
    x.fillStyle = HUD; x.fillRect(0, H - 10, W, 10);
    x.font = '28px ' + MONO;
    x.fillText('【' + stageLabel(titleIndex(item._cp || START_CP)) + '】', 50, H - 36);
    x.textAlign = 'right'; x.fillStyle = '#ff9d00';
    x.fillText('GOAL // ' + daysLeft() + ' DAYS LEFT', W - 50, H - 36);
    x.textAlign = 'left';
    return c;
}

function shareCard() {
    if (!cardBlob) return;
    var file = new File([cardBlob], cardName, { type: cardBlob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'TBA360 戰績' }).catch(function (e) {
            if (e.name !== 'AbortError') downloadCard();
        });
    } else downloadCard();
}

function downloadCard() {
    var a = document.createElement('a');
    a.href = $('cardImg').src;
    a.download = cardName;
    document.body.appendChild(a);
    a.click();
    a.remove();
}

function closeCard() {
    $('cardModal').style.display = 'none';
    if ($('cardImg').src) URL.revokeObjectURL($('cardImg').src);
    cardBlob = null;
}
</script>
</body>
</html>
